name: Keep the hosted demo awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Request the health endpoint
        run: curl --fail --silent --show-error --retry 3 --retry-delay 10 --max-time 60 https://contra-h0nw.onrender.com/health
